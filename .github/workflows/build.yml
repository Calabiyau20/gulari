name: Build

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libraries
        run: bash setup.sh
      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build VST3, AU, CLAP, Standalone
        run: cmake --build build --config Release --target Synthgularity_VST3 Synthgularity_AU Synthgularity_CLAP Synthgularity_Standalone -- -quiet
      - name: Ad-hoc sign
        run: |
          cd build/Synthgularity_artefacts/Release
          for p in VST3/*.vst3 AU/*.component CLAP/*.clap Standalone/*.app; do codesign --force --deep -s - "$p"; done
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Synthgularity_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Sygy CbYu
      - name: Package
        run: |
          cd build/Synthgularity_artefacts/Release
          ditto -c -k --keepParent VST3/Synthgularity.vst3 ../../../Synthgularity-mac-VST3.zip
          ditto -c -k --keepParent AU/Synthgularity.component ../../../Synthgularity-mac-AU.zip
          ditto -c -k --keepParent CLAP/Synthgularity.clap ../../../Synthgularity-mac-CLAP.zip
          ditto -c -k --keepParent Standalone/Synthgularity.app ../../../Synthgularity-mac-Standalone.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Synthgularity-macOS
          path: Synthgularity-mac-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libraries
        shell: bash
        run: bash setup.sh
      - name: Configure
        run: cmake -B build -A x64 -T ClangCL
      - name: Build VST3, CLAP, Standalone
        run: cmake --build build --config Release --target Synthgularity_VST3 Synthgularity_CLAP Synthgularity_Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: Synthgularity-Windows
          path: |
            build/Synthgularity_artefacts/Release/VST3
            build/Synthgularity_artefacts/Release/CLAP
            build/Synthgularity_artefacts/Release/Standalone

name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The gate. Nothing gets packaged until the DSP and the interface both pass, because a build that
  # compiles can still ship a panel full of dead controls - which is exactly how 1.0.0 went out.
  # Linux only: it is the one runner where a headless X server is a single apt package.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build and display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev
      - name: Fetch libraries
        run: bash setup.sh
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPG_BUILD_TESTS=ON
      - name: Build the test programs
        run: cmake --build build --target WcRenderTest WcUiSnapshot
      - name: DSP, modules and licensing
        run: ./build/WcRenderTest_artefacts/Release/WcRenderTest "${RUNNER_TEMP}/render"
      - name: Interface - panels, zoom, cables, every button on the 250
        run: xvfb-run -a ./build/WcUiSnapshot_artefacts/Release/WcUiSnapshot "${RUNNER_TEMP}/ui"
      - name: Keep the panel snapshots, pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WestCoast-panels
          path: ${{ runner.temp }}/ui/*.png
          if-no-files-found: warn

  macos:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libraries
        run: bash setup.sh
      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build VST3, AU, CLAP, Standalone
        run: cmake --build build --config Release --target Synthgularity_VST3 Synthgularity_AU Synthgularity_CLAP Synthgularity_Standalone CalabiYauResonator_VST3 CalabiYauResonator_AU CalabiYauResonator_CLAP CalabiYauResonator_Standalone WestCoastModular_VST3 WestCoastModular_AU WestCoastModular_CLAP WestCoastModular_Standalone -- -quiet
      - name: Ad-hoc sign
        run: |
          cd build/Synthgularity_artefacts/Release
          for p in VST3/*.vst3 AU/*.component CLAP/*.clap Standalone/*.app; do codesign --force --deep -s - "$p"; done
          cd ../../CalabiYauResonator_artefacts/Release
          for p in VST3/*.vst3 AU/*.component CLAP/*.clap Standalone/*.app; do codesign --force --deep -s - "$p"; done
          cd ../../WestCoastModular_artefacts/Release
          for p in VST3/*.vst3 AU/*.component CLAP/*.clap Standalone/*.app; do codesign --force --deep -s - "$p"; done
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Synthgularity_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          cp -R build/CalabiYauResonator_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          cp -R build/WestCoastModular_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Sygy CbYu
          auval -v aumu CyRs CbYu
          auval -v aumu CyWc CbYu
      - name: Check minimum macOS
        run: |
          vtool -show-build build/Synthgularity_artefacts/Release/AU/Synthgularity.component/Contents/MacOS/Synthgularity | grep -E "minos|version"
          vtool -show-build build/Synthgularity_artefacts/Release/AU/Synthgularity.component/Contents/MacOS/Synthgularity | grep -E "minos 10\.15" || (echo "Wrong deployment target"; exit 1)
      - name: Package
        run: |
          cd build/Synthgularity_artefacts/Release
          ditto -c -k --keepParent VST3/Synthgularity.vst3 ../../../Synthgularity-mac-VST3.zip
          ditto -c -k --keepParent AU/Synthgularity.component ../../../Synthgularity-mac-AU.zip
          ditto -c -k --keepParent CLAP/Synthgularity.clap ../../../Synthgularity-mac-CLAP.zip
          ditto -c -k --keepParent Standalone/Synthgularity.app ../../../Synthgularity-mac-Standalone.zip
          cd ../../CalabiYauResonator_artefacts/Release
          ditto -c -k --keepParent "VST3/Calabi-Yau Resonator.vst3" ../../../Resonator-mac-VST3.zip
          ditto -c -k --keepParent "AU/Calabi-Yau Resonator.component" ../../../Resonator-mac-AU.zip
          ditto -c -k --keepParent "CLAP/Calabi-Yau Resonator.clap" ../../../Resonator-mac-CLAP.zip
          ditto -c -k --keepParent "Standalone/Calabi-Yau Resonator.app" ../../../Resonator-mac-Standalone.zip
          cd ../../WestCoastModular_artefacts/Release
          ditto -c -k --keepParent "VST3/Calabi Yau West Coast Modular.vst3" ../../../WestCoast-mac-VST3.zip
          ditto -c -k --keepParent "AU/Calabi Yau West Coast Modular.component" ../../../WestCoast-mac-AU.zip
          ditto -c -k --keepParent "CLAP/Calabi Yau West Coast Modular.clap" ../../../WestCoast-mac-CLAP.zip
          ditto -c -k --keepParent "Standalone/Calabi Yau West Coast Modular.app" ../../../WestCoast-mac-Standalone.zip
      - name: Publish build to the 'builds' branch
        run: |
          mkdir -p /tmp/out/mac && cp -R build/Synthgularity_artefacts/Release/VST3/Synthgularity.vst3 build/Synthgularity_artefacts/Release/AU/Synthgularity.component build/Synthgularity_artefacts/Release/CLAP/Synthgularity.clap /tmp/out/mac/
          mkdir -p /tmp/out/resonator-mac && cp -R build/CalabiYauResonator_artefacts/Release/VST3/*.vst3 build/CalabiYauResonator_artefacts/Release/AU/*.component build/CalabiYauResonator_artefacts/Release/CLAP/*.clap /tmp/out/resonator-mac/
          cp Synthgularity-mac-*.zip Resonator-mac-*.zip WestCoast-mac-*.zip /tmp/out/
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "macOS build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
      - uses: actions/upload-artifact@v4
        with:
          name: Synthgularity-macOS
          path: |
            Synthgularity-mac-*.zip
            Resonator-mac-*.zip
            WestCoast-mac-*.zip

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libraries
        shell: bash
        run: bash setup.sh
      - name: Configure
        run: cmake -B build -A x64 -T ClangCL
      - name: Build VST3, CLAP, Standalone
        run: cmake --build build --config Release --target Synthgularity_VST3 Synthgularity_CLAP Synthgularity_Standalone CalabiYauResonator_VST3 CalabiYauResonator_CLAP CalabiYauResonator_Standalone WestCoastModular_VST3 WestCoastModular_CLAP WestCoastModular_Standalone
      - name: Publish build to the 'builds-windows' branch
        shell: bash
        run: |
          mkdir -p /tmp/out/win
          cp -R build/Synthgularity_artefacts/Release/VST3/Synthgularity.vst3 /tmp/out/win/
          cp build/Synthgularity_artefacts/Release/CLAP/Synthgularity.clap /tmp/out/win/
          cp build/Synthgularity_artefacts/Release/Standalone/Synthgularity.exe /tmp/out/win/
          mkdir -p /tmp/out/resonator-win
          cp -R "build/CalabiYauResonator_artefacts/Release/VST3/Calabi-Yau Resonator.vst3" /tmp/out/resonator-win/
          cp "build/CalabiYauResonator_artefacts/Release/CLAP/Calabi-Yau Resonator.clap" /tmp/out/resonator-win/
          cp "build/CalabiYauResonator_artefacts/Release/Standalone/Calabi-Yau Resonator.exe" /tmp/out/resonator-win/
          mkdir -p /tmp/out/westcoast-win
          cp -R "build/WestCoastModular_artefacts/Release/VST3/Calabi Yau West Coast Modular.vst3" /tmp/out/westcoast-win/
          cp "build/WestCoastModular_artefacts/Release/CLAP/Calabi Yau West Coast Modular.clap" /tmp/out/westcoast-win/
          cp "build/WestCoastModular_artefacts/Release/Standalone/Calabi Yau West Coast Modular.exe" /tmp/out/westcoast-win/
          cd /tmp/out
          git init -q -b builds-windows
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Windows build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds-windows
      - uses: actions/upload-artifact@v4
        with:
          name: Synthgularity-Windows
          path: |
            build/Synthgularity_artefacts/Release/VST3
            build/Synthgularity_artefacts/Release/CLAP
            build/Synthgularity_artefacts/Release/Standalone
            build/CalabiYauResonator_artefacts/Release/VST3
            build/CalabiYauResonator_artefacts/Release/CLAP
            build/CalabiYauResonator_artefacts/Release/Standalone
